name: sim_file_replayer

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      # https://github.com/lokkju/github-action-sbt
      - name: Build with SBT
        uses: lokkju/github-action-sbt@master
        with:
          commands: clean compile test
          sbt_project_directory: ./
